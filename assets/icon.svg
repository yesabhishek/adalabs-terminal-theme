<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">AdaLabs Terminal</title>
  <desc id="desc">A die-cut sticker: a tile split from black to paper with a terminal prompt crossing both halves and a peeled corner.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="flapShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="flap" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D6D0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect x="42" y="42" width="172" height="172" rx="36"/></clipPath>
    <clipPath id="uncut"><polygon points="0,0 256,0 256,136 136,256 0,256"/></clipPath>
    <clipPath id="darkHalf"><polygon points="0,0 256,0 0,256"/></clipPath>
    <clipPath id="lightHalf"><polygon points="256,0 256,256 0,256"/></clipPath>
  </defs>

  <g transform="rotate(-7 128 128)">
    <!-- die-cut white border with peeled bottom-right corner -->
    <path filter="url(#shadow)" fill="#FFFFFF"
      d="M78 30H178A48 48 0 0 1 226 78V170L170 226H78A48 48 0 0 1 30 178V78A48 48 0 0 1 78 30Z"/>

    <g clip-path="url(#uncut)">
      <g clip-path="url(#tile)">
        <rect x="42" y="42" width="172" height="172" fill="#F3EEE4"/>
        <polygon points="42,42 214,42 42,214" fill="#0E0E10"/>
        <rect x="42" y="42" width="172" height="172" fill="url(#gloss)"/>
      </g>

      <!-- prompt: paper on the dark half, ink on the light half -->
      <g fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
        <path clip-path="url(#darkHalf)" stroke="#F3EEE4" d="M84 84L134 128L84 172"/>
        <path clip-path="url(#lightHalf)" stroke="#0E0E10" d="M84 84L134 128L84 172"/>
      </g>
      <path stroke="#FF8A3D" stroke-width="22" stroke-linecap="round" d="M150 172H184"/>
    </g>

    <!-- peeled flap -->
    <path filter="url(#flapShadow)" fill="url(#flap)" d="M226 170L170 226Q176 182 184 180Q188 172 226 170Z"/>
  </g>
</svg>
